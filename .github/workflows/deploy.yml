name: Deploy mdBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 cargo 可执行文件，避免每次重新编译 mdbook / 预处理器
      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-mdbook-0.5.4-langtabs-0.2.0

      # mdbook-langtabs 是 book.toml 中 [preprocessor.langtabs] 所需的插件
      - name: Install mdBook and langtabs preprocessor
        run: |
          command -v mdbook          >/dev/null || cargo install mdbook --version 0.5.4
          command -v mdbook-langtabs >/dev/null || cargo install mdbook-langtabs --version 0.2.0
          mdbook --version
          mdbook-langtabs --help >/dev/null && echo "mdbook-langtabs ready"

      - name: Build book
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
